 <g transform="translate(44 214) rotate(-7) scale(1.14)" filter="url(#msh)">
  <path d="M0.0 210.0L0.0 0.0L62.0 0.0L115.0 86.0L168.0 0.0L230.0 0.0L230.0 210.0L176.0 210.0L176.0 96.0L132.0 166.0L98.0 166.0L54.0 96.0L54.0 210.0Z" transform="translate(9 11)" fill="#B87412" stroke="#B87412" stroke-width="18" stroke-linejoin="round"/>
