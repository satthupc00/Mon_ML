  <path d="M0.0 210.0L0.0 0.0L62.0 0.0L115.0 86.0L168.0 0.0L230.0 0.0L230.0 210.0L176.0 210.0L176.0 96.0L132.0 166.0L98.0 166.0L54.0 96.0L54.0 210.0Z" fill="url(#gl)"/>
 </g>
 <!-- cuốn sổ lò xo -->
 <g transform="translate(150 6) scale(0.8) rotate(-5 256 270)">
