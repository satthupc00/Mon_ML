<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<title>Mon Inkdays — Day Pad</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF6D6"/><stop offset="1" stop-color="#FFD3B6"/></linearGradient>
  <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6F6A"/><stop offset="1" stop-color="#E0323F"/></linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFF4E2"/></linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9AA3B5"/><stop offset=".5" stop-color="#F4F6FA"/><stop offset="1" stop-color="#7C8597"/></linearGradient>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6C7BF2"/><stop offset="1" stop-color="#26296E"/></linearGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#B0583A" flood-opacity=".3"/></filter>
</defs>
<rect width="512" height="512" rx="114" fill="url(#bg)"/>
<g filter="url(#sh)" transform="rotate(-5 256 270)">
  <!-- các trang dưới = 3 màu tag -->
  <rect x="112" y="128" width="288" height="306" rx="30" fill="#CDEFD5"/>
  <rect x="108" y="120" width="288" height="300" rx="30" fill="#C9A48C"/>
  <rect x="104" y="112" width="288" height="294" rx="30" fill="#F9D3DF"/>
  <!-- trang trên cùng -->
  <rect x="100" y="104" width="288" height="290" rx="30" fill="url(#paper)"/>
  <path d="M130 104H358A30 30 0 0 1 388 134V170H100V134A30 30 0 0 1 130 104Z" fill="url(#top)"/>
  <rect x="100" y="104" width="288" height="30" rx="30" fill="#fff" opacity=".15"/>
  <!-- giọt mực + dòng viết -->
  <path d="M244 196L276.04 251.5A37 37 0 1 1 211.96 251.5Z" fill="url(#ink)"/>
  <ellipse cx="231" cy="268" rx="8" ry="12" fill="#fff" opacity=".7" transform="rotate(25 231 268)"/>
  <g stroke="#D9C9B0" stroke-width="8" stroke-linecap="round"><path d="M142 344H346"/><path d="M142 370H290"/></g>
  <!-- khoen lò xo -->
  <g fill="url(#ring)">
    <rect x="150" y="80" width="16" height="56" rx="8"/><rect x="204" y="80" width="16" height="56" rx="8"/>
    <rect x="258" y="80" width="16" height="56" rx="8"/><rect x="312" y="80" width="16" height="56" rx="8"/>
  </g>
</g>
</svg>
