# Build Mon Inkdays cho Windows (.exe) và Android (.apk) rồi đăng lên GitHub Releases.
# Tự chạy khi push code: nếu "version" trong package.json chưa có bản phát hành v<version> thì build + phát hành.
name: Release

on:
  push:
    paths-ignore: ['mockup/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      need_win: ${{ steps.v.outputs.need_win }}
      need_apk: ${{ steps.v.outputs.need_apk }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          # Chỉ build phần còn thiếu trong bản phát hành v<version>
          ASSETS=$(gh release view "v$VER" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null || true)
          if echo "$ASSETS" | grep -q '^latest.yml$'; then echo "need_win=false" >> "$GITHUB_OUTPUT"; else echo "need_win=true" >> "$GITHUB_OUTPUT"; fi
          if echo "$ASSETS" | grep -q '\.apk$'; then echo "need_apk=false" >> "$GITHUB_OUTPUT"; else echo "need_apk=true" >> "$GITHUB_OUTPUT"; fi
          echo "v$VER assets: $ASSETS"

  windows:
    needs: check
    if: needs.check.outputs.need_win == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Windows installer
        run: npm run dist:win
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Mon Inkdays v${{ needs.check.outputs.version }}
          body: |
            Mon Inkdays v${{ needs.check.outputs.version }}
            - Windows: tải **MonML-Setup-${{ needs.check.outputs.version }}.exe**
            - Android (Z Fold 7): tải **MonML-${{ needs.check.outputs.version }}.apk**
            - Lưu ý từ v1.1.2: app Android đã đăng ký chính chủ với Google, đổi khoá ký + mã app mới `com.mondiro.ml`. Lần đầu cần cài bản mới rồi gỡ bản cũ (nhớ đồng bộ dữ liệu trước). Các bản sau cài đè bình thường.
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  android:
    needs: [check, windows]
    if: ${{ !cancelled() && needs.check.outputs.need_apk == 'true' && needs.windows.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build web + sync Capacitor
        run: npm run android:sync
      - name: Giải mã khoá ký (GitHub Secrets)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then echo "::error::Thiếu secret ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/mondiro.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/mondiro.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          echo "::add-mask::$KS_PASS"
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: |
          VER=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "MonML-$VER.apk"
      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: MonML-*.apk
