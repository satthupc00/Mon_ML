# Build Mon ML cho Windows (.exe) và Android (.apk) rồi đăng lên GitHub Releases.
# Tự chạy khi push code: nếu "version" trong package.json chưa có bản phát hành v<version> thì build + phát hành.
name: Release

on:
  push:
    paths-ignore: ['mockup/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "v$VER đã phát hành, bỏ qua"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Sẽ phát hành v$VER"
            # Tạo tag v<version> trỏ vào commit này (Releases cần tag có sẵn)
            if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VER" >/dev/null 2>&1; then
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VER" -f sha="$GITHUB_SHA"
            fi
          fi

  windows:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build & publish Windows installer
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    needs: [check, windows]
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Build web + sync Capacitor
        run: npm run android:sync
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: |
          VER=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "MonML-$VER.apk"
      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          files: MonML-*.apk
